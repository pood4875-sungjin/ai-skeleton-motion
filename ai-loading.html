<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 로딩 모션 — 온사이트</title>
<style>
  /* @property: 그라데이션 테두리 회전용 (Chromium 지원) */
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  :root{
    --emerald-50:#1bb9cd;   /* 타이틀 텍스트 */
    --emerald-60:#50c9d8;   /* 아이콘 / 그라데이션 시작 */
    --blue:#1981ef;         /* 그라데이션 끝 */
    --bluegray-55:#7a808d;  /* 캡션 */
    --cardB-bg:#eef2f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px; background:#fff;
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:#1f2329;
  }
  .label{font-size:12px; color:var(--bluegray-55); margin:0 0 10px}
  .stack{display:flex; flex-direction:column; gap:40px; max-width:640px}

  /* ---------- AI 아이콘 (커졌다 작아지는 펄스) ---------- */
  /* 아이콘 통짜로 아주 미세하게 커졌다 작아짐 */
  .ai-icon{
    display:inline-block; color:var(--emerald-60); line-height:0;
    transform-origin:center;
    animation:ai-pulse 2.4s ease-in-out infinite;
  }
  .ai-icon svg{display:block; width:100%; height:100%; overflow:visible}
  @keyframes ai-pulse{
    0%,100%{transform:scale(.975)}
    50%    {transform:scale(1.04)}
  }
  /* 교체되는 텍스트 페이드 */
  .rot{
    display:inline-block;
    transition:opacity .28s ease, transform .28s ease;
  }
  .rot.swap{opacity:0; transform:translateY(-4px)}

  /* ================= A. 헤더 + 스켈레톤 ================= */
  .card{
    background:#fff; border:1px solid #e8ebee; border-radius:12px;
    padding:20px 24px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px}
  .head .title{
    display:flex; align-items:center; gap:4px;
    font-size:16px; font-weight:600; letter-spacing:-0.031px;
    line-height:1.5; color:var(--emerald-50);
  }
  .head .title .ai-icon{width:18.55px; height:18.05px}
  .head .meta{
    display:flex; align-items:center; gap:2px;
    font-size:12px; color:var(--bluegray-55); letter-spacing:.3px;
  }
  /* 스켈레톤 바: figma 정확값 — emerald→blue, opacity 20%, h23 gap5 r4 */
  .skeleton{display:flex; flex-direction:column; gap:5px; width:560px; max-width:100%}
  .skeleton .bar{
    position:relative; overflow:hidden;
    height:23px; border-radius:4px;
    /* figma: #50c9d8→#1981ef @ opacity 20% 를 흰 배경 유효색으로 베이크 */
    background:linear-gradient(to right, #dcf4f7, #d1e6fc);
  }
  /* 스켈레톤 로딩 shimmer: 빛줄기가 좌→우로 sweep, 줄마다 시차 */
  .skeleton .bar::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 25%, rgba(255,255,255,.7) 50%, transparent 75%);
    transform:translateX(-100%);
    animation:bar-shimmer 2.8s ease-in-out infinite;
  }
  .skeleton .bar:nth-child(2)::after{animation-delay:.2s}
  .skeleton .bar:nth-child(3)::after{animation-delay:.4s}
  .skeleton .bar:nth-child(4)::after{animation-delay:.6s}
  @keyframes bar-shimmer{ 0%{transform:translateX(-100%)} 60%,100%{transform:translateX(100%)} }
  /* figma 41792 정확값(컨테이너 560): 560 / 560 / 458 / 409 */
  .skeleton .bar:nth-child(1){width:100%}
  .skeleton .bar:nth-child(2){width:100%}
  .skeleton .bar:nth-child(3){width:81.8%}
  .skeleton .bar:nth-child(4){width:73%}

  /* ================= B. 그라데이션 테두리 카드 ================= */
  .grad-card{
    position:relative; width:560px; max-width:100%; border-radius:10px; padding:2px;
    /* figma 테두리색 #9fd8df 고정 + 밝은 teal 하이라이트만 회전 */
    background:conic-gradient(from var(--angle),
      #9fd8df, #50c9d8, #dcf3f6, #50c9d8, #9fd8df);
    animation:spin 3.2s linear infinite;
  }
  @keyframes spin{ to{ --angle:360deg } }
  .grad-card .inner{
    border-radius:8px; background:var(--cardB-bg);
    min-height:120px; padding:28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .grad-card .ai-icon{width:22px; height:22px}
  .grad-card .text{
    font-size:15px; font-weight:600; letter-spacing:-0.2px; color:var(--emerald-50);
  }

  /* ---------- 접근성: 모션 최소화 ---------- */
  @media (prefers-reduced-motion: reduce){
    .ai-icon{animation:none; transform:none}
    .grad-card{animation:none; --angle:120deg}
    .skeleton .bar::after{animation:none; display:none}
    .rot{transition:none}
  }
</style>
</head>
<body>
  <div class="stack">
    <!-- A. 헤더 + 스켈레톤 -->
    <div>
      <p class="label">A. AI 분석 헤더 + 스켈레톤 (node 41779 / 41792)</p>
      <div class="card">
        <div class="head">
          <div class="title" role="status" aria-label="AI가 분석 중입니다">
            <span class="ai-icon" data-icon aria-hidden="true"></span>
            <span class="rot" data-rot="head">AI가 경향을 분석 중...</span>
          </div>
          <div class="meta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>10분 전 업데이트</span>
          </div>
        </div>
        <div class="skeleton" aria-hidden="true">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </div>

    <!-- B. 그라데이션 테두리 카드 -->
    <div>
      <p class="label">B. 데이터 수집 카드 — 회전 그라데이션 테두리 (node 41140)</p>
      <div class="grad-card">
        <div class="inner" role="status" aria-label="데이터를 수집하는 중입니다">
          <span class="ai-icon" data-icon aria-hidden="true"></span>
          <div class="text">
            <span class="rot" data-rot="card">지중경사계 데이터 수집 중...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // AI 아이콘 SVG 주입
    const ICON = `<svg viewBox="0 0 18.5485 18.0472" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="star-a" d="M9.22847 8.68004C9.228 8.68052 9.22722 8.67994 9.22755 8.67935L11.2438 4.97075C11.4237 4.63979 11.8988 4.63977 12.0787 4.97071L13.8211 8.17489C13.9991 8.50396 14.2691 8.77531 14.5966 8.95428L17.7904 10.7085C18.1189 10.889 18.1189 11.3611 17.7904 11.5415L14.5966 13.2958C14.2691 13.4747 13.9991 13.7461 13.8211 14.0751L12.0787 17.2794C11.8987 17.6103 11.4237 17.6103 11.2437 17.2794L9.50133 14.0751C9.32325 13.7461 9.05327 13.4747 8.72584 13.2958L5.53213 11.5416C5.20354 11.3611 5.20356 10.889 5.53216 10.7085L9.22778 8.67912C9.22837 8.67879 9.22895 8.67956 9.22847 8.68004Z" fill="currentColor"/><path class="star-b" d="M2.87236 2.10721L3.60401 0.765235C3.78409 0.434927 4.25837 0.434928 4.43845 0.765235L5.1701 2.10721C5.34817 2.43629 5.61816 2.70763 5.94558 2.8866L7.2864 3.62499C7.61436 3.8056 7.61436 4.27689 7.28641 4.4575L5.94558 5.1959C5.61816 5.37487 5.34817 5.64621 5.1701 5.97528L4.43845 7.31726C4.25837 7.64757 3.78409 7.64757 3.60401 7.31726L2.87236 5.97528C2.69429 5.64621 2.4243 5.37487 2.09688 5.1959L0.756054 4.4575C0.428097 4.27689 0.428096 3.8056 0.756053 3.62499L2.09688 2.8866C2.4243 2.70763 2.69429 2.43629 2.87236 2.10721Z" fill="currentColor"/></svg>`;
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICON);

    // 일정 시간마다 텍스트 교체 (페이드)
    const MESSAGES = {
      head: ["AI가 경향을 분석 중...", "AI가 이상 패턴을 탐지 중...", "AI가 구간별 추이를 비교 중...", "AI가 리포트를 작성 중..."],
      card: ["지중경사계 데이터 수집 중...", "센서 신호를 동기화 중...", "결측값을 보정 중...", "분석을 준비 중..."],
    };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll('[data-rot]').forEach(el => {
      const list = MESSAGES[el.dataset.rot];
      let i = 0;
      setInterval(() => {
        if (reduce){ i=(i+1)%list.length; el.textContent=list[i]; return; }
        el.classList.add('swap');
        setTimeout(() => { i=(i+1)%list.length; el.textContent=list[i]; el.classList.remove('swap'); }, 280);
      }, 3200);
    });
  </script>
</body>
</html>
